[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "badapple-earth"
version = "0.1.0"
description = "Match video frames with real satellite and aerial imagery"
readme = "README.md"
license-files = ["THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2,<3",
  "pillow>=11,<13",
  "pyproj>=3.7,<4",
  "pystac-client>=0.9,<0.10",
  "rasterio>=1.4,<2",
  "shapely>=2.1,<3",
  "pyarrow>=20,<25",
  "psutil>=7,<9",
  "av>=15,<19",
  "scipy>=1.14,<2",
  "numba>=0.68,<1",
  "opencv-python-headless>=4.12,<5",
]

[project.scripts]
badapple-earth = "badapple_earth.cli:main"

[project.urls]
Repository = "https://github.com/neuwcodebox/badapple-earth"
Issues = "https://github.com/neuwcodebox/badapple-earth/issues"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
cache-dir = ".local/uv-cache"
